<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SHO | Gestión de Márgenes V25</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SHO Oro">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            background-color: #f8fafc; 
            color: #0f172a; 
        }
        .h-header { height: 48px; }
        .status-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="sticky top-0 z-50 h-header px-4 border-b bg-white border-slate-200 shadow-sm">
        <div class="max-w-md mx-auto h-full flex justify-between items-center">
            <div class="flex items-center gap-2">
                <img src="logo.png" alt="SHO" class="w-7 h-7 rounded-md object-cover shadow-sm">
                <h1 class="font-black text-xl tracking-[0.1em] uppercase italic leading-none text-slate-900">SHO</h1>
            </div>
            
            <div id="status-badge" class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-50 border border-slate-100 text-[8px] font-black uppercase tracking-widest italic">
                <span id="status-dot" class="w-1.5 h-1.5 bg-amber-500 rounded-full status-pulse"></span>
                <span id="status-text" class="text-slate-500">Sincronizando...</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-6 text-center">
        <section class="mb-6">
            <p class="text-[9px] font-black uppercase tracking-[0.3em] text-slate-400 mb-1 italic leading-none">BID Oficial (EUR/Gr)</p>
            <div id="fixing-price" class="text-6xl font-black tracking-tighter tabular-nums mb-3 italic leading-none text-slate-900">0.00 €/gr</div>
            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-slate-100 border border-slate-200">
                <span class="text-[9px] font-black uppercase tracking-widest italic text-slate-500">Precio Plata</span>
                <span id="silver-price" class="text-sm font-black tabular-nums text-slate-900">—</span>
                <span class="text-[9px] font-black uppercase tracking-widest italic text-slate-500">€/gr</span>
            </div>
        </section>

        <section class="mb-6 bg-white rounded-[1.5rem] border border-slate-200 shadow-sm p-4">
            <p class="text-[9px] font-black uppercase tracking-[0.3em] text-slate-400 mb-3 italic leading-none text-left">Evolución 7 días (EUR/Gr)</p>
            <div id="chart-empty" class="hidden text-center py-6 text-[10px] text-slate-400 italic">Sin datos históricos aún</div>
            <canvas id="price-chart" height="140"></canvas>
        </section>

        <div id="price-list" class="space-y-3 text-left"></div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-8 py-4 pb-8 flex justify-around items-center z-40">
        <button class="flex flex-col items-center gap-1 text-amber-500">
            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            <span class="text-[9px] font-black uppercase italic tracking-widest leading-none">Precios</span>
        </button>
        <button onclick="openCalc()" class="flex flex-col items-center gap-1 text-slate-400 hover:text-amber-500 transition-colors">
            <i data-lucide="calculator" class="w-5 h-5"></i>
            <span class="text-[9px] font-black uppercase italic tracking-widest leading-none">Calcular</span>
        </button>
    </nav>

    <div id="calc-sheet" class="fixed inset-0 z-50 hidden flex items-end">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeCalc()"></div>
        <div id="calc-content" class="relative w-full bg-white rounded-t-[2.5rem] p-8 translate-y-full transition-transform duration-500 border-t border-slate-200 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div class="w-10 h-1 bg-slate-100 rounded-full"></div>
                <button onclick="closeCalc()" class="h-9 w-9 bg-slate-100 rounded-full flex items-center justify-center text-slate-400 active:bg-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="space-y-6 pb-6 text-slate-900">
                <div class="grid grid-cols-3 gap-2" id="calc-kts-grid"></div>
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-inner">
                        <label class="block text-[8px] font-black uppercase text-amber-600 mb-1 italic">Peso Gr.</label>
                        <input type="number" id="input-weight" placeholder="0.00" class="bg-transparent w-full text-2xl font-black outline-none tabular-nums" inputmode="decimal">
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-inner">
                        <label class="block text-[8px] font-black uppercase text-slate-400 mb-1 italic">Merma Gr.</label>
                        <input type="number" id="input-merma" value="0" class="bg-transparent w-full text-2xl font-black outline-none tabular-nums text-slate-400" inputmode="decimal">
                    </div>
                </div>
                <div class="bg-amber-500 p-6 rounded-3xl text-white shadow-xl shadow-amber-500/30">
                    <p class="text-[8px] font-black uppercase opacity-90 mb-1 tracking-widest italic leading-none">Total Liquidación</p>
                    <div id="calc-result" class="text-5xl font-black tracking-tighter tabular-nums leading-none">0.00€</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ── CONFIGURACIÓN DE QUILATES ──────────────────────────────────
        // Cada quilate tiene: label, multiplicador, pureza y extra
        const KTS = [
            { l: '24KT', m: 1.000, p: 999, extra: 0.80 },
            { l: '21KT', m: 0.900, p: 900, extra: 0.75 },
            { l: '18KT', m: 0.750, p: 750, extra: 0.70 },
            { l: '14KT', m: 0.535, p: 535, extra: 0.60 },
            { l: '9KT', m: 0.375, p: 375, extra: 0.50 }
        ];

        let goldPrice = 0;   // Precio BID del oro en EUR/gr (viene de la DB)
        let selectedKt = 750; // Quilate seleccionado en la calculadora

        // ── FÓRMULAS DE NEGOCIO ────────────────────────────────────────
        // Precio mayorista = (precio spot × multiplicador) - 2.50€ costes fijos
        const calcW = (f, m) => (f * m) - 2.50;
        // Precio compra = (mayorista × 0.94 descuento) - 6.00€ operativos + extra quilate
        const calcR = (w, extra) => (w * 0.94) - 6.00 + extra;

        // ── ESTADO DE LA CABECERA ──────────────────────────────────────
        // Actualiza el badge de estado con el mensaje y color apropiados
        function setStatus(tipo, mensaje) {
            const text = document.getElementById('status-text');
            const dot = document.getElementById('status-dot');

            // Tipos posibles: ok (verde), warning (ámbar), error (rojo), loading (ámbar pulsante)
            const estilos = {
                ok:      { dotClass: 'w-1.5 h-1.5 bg-green-500 rounded-full',              textClass: 'text-green-600 font-bold' },
                warning: { dotClass: 'w-1.5 h-1.5 bg-amber-500 rounded-full',              textClass: 'text-amber-600 font-bold' },
                error:   { dotClass: 'w-1.5 h-1.5 bg-red-500 rounded-full',                textClass: 'text-red-500 font-bold' },
                loading: { dotClass: 'w-1.5 h-1.5 bg-amber-500 rounded-full status-pulse', textClass: 'text-slate-500' },
                closed:  { dotClass: 'w-1.5 h-1.5 bg-slate-400 rounded-full',              textClass: 'text-slate-400 font-bold' },
            };

            const estilo = estilos[tipo] || estilos.loading;
            dot.className = estilo.dotClass;
            text.className = estilo.textClass;
            text.innerText = mensaje;
        }

        // ── DETECCIÓN HORARIO MERCADO ─────────────────────────────────
        // Comprobamos si el mercado del oro está cerrado según hora española.
        // Devuelve true si estamos fuera de horario (noches L-V o fin de semana)
        function mercadoCerrado() {
            // Obtenemos la hora actual en zona horaria de España
            const ahoraEspana = new Date().toLocaleString('en-US', { timeZone: 'Europe/Madrid' });
            const fechaEspana = new Date(ahoraEspana);

            const diaSemana = fechaEspana.getDay();  // 0=domingo, 6=sábado
            const hora = fechaEspana.getHours();      // 0-23

            const esFinDeSemana = (diaSemana === 0 || diaSemana === 6);
            const esNocturno = (hora < 7); // De 00:00 a 06:59

            return esFinDeSemana || esNocturno;
        }

        // ── FUNCIÓN PRINCIPAL: OBTENER TODOS LOS DATOS ─────────────────
        // Una sola fuente de verdad: api.php (que lee de la base de datos)
        // El cron.php guarda los datos → api.php los sirve → el frontend los muestra
        async function fetchData() {
            try {
                const res = await fetch('api.php?action=history&days=7');

                // Si el servidor devuelve error HTTP
                if (!res.ok) {
                    setStatus('error', 'Error Servidor');
                    return;
                }

                const data = await res.json();

                // Si api.php devolvió un error en el JSON
                if (data.error) {
                    setStatus('error', 'Error BD');
                    return;
                }

                // Si no hay datos en la base de datos (nunca se ha ejecutado el cron)
                if (!data.latest) {
                    setStatus('error', 'Sin datos');
                    document.getElementById('fixing-price').innerText = '—';
                    document.getElementById('silver-price').innerText = '—';
                    document.getElementById('price-chart').classList.add('hidden');
                    document.getElementById('chart-empty').classList.remove('hidden');
                    return;
                }

                // ── Comprobar si el cron está funcionando ──────────────
                // Si el último registro tiene más de 60 minutos, algo va mal
                const lastUpdate = new Date(data.last_updated.replace(' ', 'T') + 'Z');
                const ahora = new Date();
                const minutosSinCron = (ahora - lastUpdate) / 1000 / 60;

                // Formateamos la hora del último cron para mostrarla
                const horaCron = lastUpdate.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

                if (mercadoCerrado()) {
                    // El mercado está cerrado — es normal que no haya datos nuevos
                    setStatus('closed', `Mercado Cerrado · ${horaCron}`);
                } else if (minutosSinCron > 60) {
                    // El cron lleva más de 60 minutos sin ejecutarse
                    setStatus('error', `Error Cron · ${horaCron}`);
                } else {
                    // Todo bien — mostramos la hora de la última sincronización
                    setStatus('ok', `Sincronizado · ${horaCron}`);
                }

                // ── Actualizar precio del oro (BID OFICIAL) ───────────
                goldPrice = data.latest.price_eur;
                document.getElementById('fixing-price').innerText = `${goldPrice.toFixed(2)} €/gr`;

                // ── Actualizar precio de la plata ──────────────────────
                if (data.latest.silver_eur !== null && data.latest.silver_eur !== undefined) {
                    document.getElementById('silver-price').innerText = data.latest.silver_eur.toFixed(2);
                } else {
                    document.getElementById('silver-price').innerText = '—';
                }

                // ── Renderizar tarjetas de precios por quilate ────────
                render();

                // ── Renderizar gráfica ────────────────────────────────
                if (data.history && data.history.length > 1) {
                    document.getElementById('price-chart').classList.remove('hidden');
                    document.getElementById('chart-empty').classList.add('hidden');
                    renderChart(data.history);
                } else {
                    document.getElementById('price-chart').classList.add('hidden');
                    document.getElementById('chart-empty').classList.remove('hidden');
                }

            } catch (e) {
                // Error de red (servidor caído, sin conexión, etc.)
                setStatus('error', 'Error Red');
            }
        }

        // ── RENDERIZAR TARJETAS DE PRECIOS ─────────────────────────────
        function render() {
            const list = document.getElementById('price-list');
            list.innerHTML = '';
            KTS.forEach(kt => {
                const w = calcW(goldPrice, kt.m);
                const r = calcR(w, kt.extra);
                const diff = w - r;

                const card = document.createElement('div');
                card.className = "p-4 rounded-[1.5rem] border bg-white border-slate-200 shadow-sm flex flex-col justify-between min-h-[110px] max-h-[150px] overflow-hidden";

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex flex-col">
                            <span class="text-2xl font-black italic tracking-tighter text-slate-900 leading-none">${kt.l}</span>
                            <span class="mt-1.5 px-2 py-0.5 rounded-full border border-slate-100 text-[8px] font-bold text-slate-400 w-fit leading-none shadow-inner">${kt.p}</span>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-[8px] font-black uppercase tracking-widest text-slate-400 italic mb-0.5 leading-none">NOS LO PAGAN A:</span>
                            <span class="text-3xl font-black tabular-nums tracking-tighter text-slate-900 leading-none">${w.toFixed(2)}€</span>
                        </div>
                    </div>

                    <div class="mt-3 bg-slate-50 border border-slate-100 p-2.5 rounded-xl flex justify-between items-center">
                        <div class="flex items-baseline gap-1.5">
                            <span class="text-[8px] font-black uppercase tracking-widest text-slate-400 italic leading-none">COMPRAMOS A:</span>
                            <span class="text-xl font-black tabular-nums text-slate-900 tracking-tighter leading-none">${r.toFixed(2)}€</span>
                        </div>
                        <div class="px-2 py-1 bg-green-500/10 rounded-lg shadow-inner leading-none">
                            <span class="text-[9px] font-black text-green-600 italic tracking-tighter">+${diff.toFixed(2)}€/G</span>
                        </div>
                    </div>`;
                list.appendChild(card);
            });
            runCalc();
        }

        // ── CALCULADORA ────────────────────────────────────────────────
        function openCalc() {
            document.getElementById('calc-sheet').classList.remove('hidden');
            setTimeout(() => document.getElementById('calc-content').classList.remove('translate-y-full'), 10);
            renderCalcKts();
        }

        function closeCalc() {
            document.getElementById('calc-content').classList.add('translate-y-full');
            setTimeout(() => document.getElementById('calc-sheet').classList.add('hidden'), 500);
        }

        function renderCalcKts() {
            const grid = document.getElementById('calc-kts-grid');
            grid.innerHTML = '';
            KTS.forEach(kt => {
                const active = selectedKt === kt.p;
                const btn = document.createElement('button');
                btn.className = `p-4 rounded-2xl font-black text-[10px] border-2 transition-all ${active ? 'border-amber-500 bg-amber-500/10 text-amber-500' : 'border-slate-200 text-slate-400'}`;
                btn.innerText = kt.l;
                btn.onclick = () => { selectedKt = kt.p; renderCalcKts(); runCalc(); };
                grid.appendChild(btn);
            });
        }

        function runCalc() {
            const weight = parseFloat(document.getElementById('input-weight').value) || 0;
            const merma = parseFloat(document.getElementById('input-merma').value) || 0;
            const kt = KTS.find(k => k.p === selectedKt);
            const r = calcR(calcW(goldPrice, kt.m), kt.extra);
            document.getElementById('calc-result').innerText = `${Math.max(0, (weight - merma) * r).toFixed(2)}€`;
        }

        // ── GRÁFICA ────────────────────────────────────────────────────
        let priceChart = null;

        function renderChart(history) {
            const labels = history.map(r => {
                const d = new Date(r.recorded_at.replace(' ', 'T') + 'Z');
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' })
                    + ' ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            });
            const prices = history.map(r => r.price_eur);

            const ctx = document.getElementById('price-chart').getContext('2d');
            if (priceChart) priceChart.destroy();

            priceChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data: prices,
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245,158,11,0.08)',
                        borderWidth: 2,
                        pointRadius: history.length > 48 ? 0 : 2,
                        pointHoverRadius: 4,
                        tension: 0.4,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: ctx => `${ctx.parsed.y.toFixed(2)} €/gr`
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { maxTicksLimit: 5, font: { size: 9, weight: '700' }, color: '#94a3b8' },
                            grid:  { display: false }
                        },
                        y: {
                            ticks: { callback: v => v.toFixed(2) + '€', font: { size: 9 }, color: '#94a3b8' },
                            grid:  { color: 'rgba(0,0,0,0.04)' }
                        }
                    }
                }
            });
        }

        // ── INICIALIZACIÓN ─────────────────────────────────────────────
        document.getElementById('input-weight').addEventListener('input', runCalc);
        document.getElementById('input-merma').addEventListener('input', runCalc);
        lucide.createIcons();

        // Cargamos todo al arrancar
        fetchData();

        // Refrescamos cada 5 minutos (300.000 ms)
        // Así detectamos nuevos datos del cron rápidamente
        setInterval(fetchData, 300000);
    </script>
</body>
</html>
